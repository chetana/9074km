name: CI

# PR : check + tests. Push sur master : check + tests, puis build et déploiement, qui attend
# l'approbation de l'environnement prod. Retour arrière : Run workflow, action rollback + tag.
# Les smoke tests e2e/ et scripts/eval-translate.mjs restent manuels (vrais secrets, vrais appels GLM).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: rollback (seule action manuelle)
        type: choice
        options: [rollback]
        default: rollback
      tag:
        description: tag à remettre (ex. 1.1.6-r531)
        required: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Construire l'image
        run: |
          VER=$(sed -nE "s/.*APP_VERSION *= *['\"]([0-9.]+)['\"].*/\1/p" src/lib/version.ts)
          TAG="$VER-r$(git rev-list --count HEAD)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -t "rg.fr-par.scw.cloud/chetana-apps/lys:$TAG" .
      - name: Refuser un build en mode dev
        run: |
          IMG="rg.fr-par.scw.cloud/chetana-apps/lys:$TAG"
          if docker run --rm --entrypoint sh "$IMG" -c 'grep -rlE "const dev = true" /app/build/server' | grep -q .; then
            echo "build en mode dev dans l'image, déploiement annulé" >&2; exit 1
          fi
          [ "$(docker run --rm --entrypoint sh "$IMG" -c 'printf %s "$NODE_ENV"')" = production ]
      - name: Envoyer l'image et relancer sur chetbox
        env:
          SSH_KEY: ${{ secrets.CHETBOX_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.CHETBOX_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id; chmod 600 ~/.ssh/id
          docker save "rg.fr-par.scw.cloud/chetana-apps/lys:$TAG" | gzip \
            | ssh -i ~/.ssh/id -o BatchMode=yes -o IdentitiesOnly=yes root@163.172.7.239 deploy

  rollback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Revenir au tag demandé
        env:
          SSH_KEY: ${{ secrets.CHETBOX_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.CHETBOX_KNOWN_HOSTS }}
          TAG: ${{ inputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id; chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o BatchMode=yes -o IdentitiesOnly=yes root@163.172.7.239 "rollback $TAG"
